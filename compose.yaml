services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./.super-partner:/app/.super-partner", "./workspaces:/app/workspaces"]
    environment:
      SUPER_PARTNER_WORKSPACE_ROOT: /app/workspaces
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]

