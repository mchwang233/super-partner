<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Partner</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try { var t = localStorage.getItem("super-partner.theme"); document.documentElement.style.colorScheme = t === "dark" ? "dark" : t === "system" ? "light dark" : "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src.tsx"></script>
  </body>
</html>
