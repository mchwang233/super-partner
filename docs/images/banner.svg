<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Super Partner: local-first multi-model task orchestration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1b1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#1fbf86" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1fbf86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="790" y1="0" x2="1234" y2="0">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0.85"/>
    </linearGradient>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- logo badge -->
  <rect x="72" y="84" width="72" height="72" rx="18" fill="none" stroke="#3ddc97" stroke-width="3"/>
  <text x="108" y="132" text-anchor="middle" class="t" font-size="30" font-weight="700" fill="#3ddc97">SP</text>

  <text x="168" y="138" class="t" font-size="54" font-weight="700" fill="#f1f5f9">Super Partner</text>
  <text x="74" y="200" class="t" font-size="24" fill="#cbd5e1">Local-first multi-model task orchestration</text>
  <text x="74" y="236" class="t" font-size="22" fill="#94a3b8">本地优先的多模型自主任务编排</text>
  <text x="74" y="276" class="mono" font-size="16" fill="#3ddc97" letter-spacing="1">plan → route → run → review → repair</text>

  <!-- dependency graph motif -->
  <g fill="none" stroke="url(#edge)" stroke-width="2.5">
    <path d="M846 110 C 900 110, 900 160, 954 160"/>
    <path d="M846 210 C 900 210, 900 160, 954 160"/>
    <path d="M1010 160 L 1066 160"/>
    <path d="M1122 160 C 1150 160, 1150 110, 1178 110"/>
    <path d="M1122 160 C 1150 160, 1150 210, 1178 210"/>
  </g>
  <g class="t" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="790" y="88" width="56" height="44" rx="10" fill="#10261f" stroke="#3ddc97" stroke-width="2"/>
    <text x="818" y="115" fill="#3ddc97">✓</text>
    <rect x="790" y="188" width="56" height="44" rx="10" fill="#10261f" stroke="#3ddc97" stroke-width="2"/>
    <text x="818" y="215" fill="#3ddc97">✓</text>
    <rect x="954" y="138" width="56" height="44" rx="10" fill="#10261f" stroke="#3ddc97" stroke-width="2"/>
    <text x="982" y="165" fill="#3ddc97">✓</text>
    <rect x="1066" y="138" width="56" height="44" rx="10" fill="#14213d" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="1094" cy="160" r="6" fill="#60a5fa"/>
    <rect x="1178" y="88" width="56" height="44" rx="10" fill="#111827" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="1178" y="188" width="56" height="44" rx="10" fill="#111827" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>
