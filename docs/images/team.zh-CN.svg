<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Super Partner 的团队：你、负责人、员工、验收者、进度检查员、诊断员、平台工程师、复盘员">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1b1a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .name { font-size: 20px; font-weight: 700; fill: #f1f5f9; }
      .desc { font-size: 14.5px; fill: #cbd5e1; }
      .note { font-size: 13px; fill: #94a3b8; }
      .card { fill: #111c2b; stroke: #2b3a4f; stroke-width: 1.5; }
      .edge { fill: none; stroke: #5eead4; stroke-opacity: .55; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>

  <!-- 一个任务内 -->
  <rect x="36" y="168" width="1208" height="364" rx="18" fill="#0f2a24" fill-opacity=".35" stroke="#3ddc97" stroke-opacity=".45" stroke-dasharray="6 6"/>
  <text x="58" y="196" class="t note" fill="#3ddc97" style="fill:#3ddc97">一个任务内</text>

  <!-- edges -->
  <path class="edge" d="M640 122 L640 200" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="652" y="166" class="t note">提问 / 回答、确认</text>
  <path class="edge" d="M350 92 C 420 92, 400 250, 436 250" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="300" y="158" class="t note">复盘已结束的任务</text>
  <path class="edge" d="M930 92 C 860 92, 880 250, 844 250" stroke-dasharray="5 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="862" y="158" class="t note">拉进群聊 / 请求组件</text>
  <g class="edge" marker-end="url(#arrow)">
    <path d="M600 318 C 600 350, 190 340, 190 384" marker-end="url(#arrow)"/>
    <path d="M625 318 C 625 350, 490 345, 490 384" marker-end="url(#arrow)"/>
    <path d="M655 318 C 655 350, 790 345, 790 384" marker-end="url(#arrow)"/>
    <path d="M680 318 C 680 350, 1090 340, 1090 384" marker-end="url(#arrow)"/>
  </g>

  <g class="t">
    <!-- 复盘员 -->
    <rect class="card" x="50" y="22" width="300" height="122" rx="14"/>
    <circle cx="86" cy="56" r="20" fill="#3b2f63"/><text x="86" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#c4b5fd">盘</text>
    <text x="118" y="63" class="name">复盘员</text>
    <text x="70" y="96" class="desc">任务结束后总结经验，把有证据</text>
    <text x="70" y="118" class="desc">的改进交给后续任务或平台工程师</text>

    <!-- 你 -->
    <rect class="card" x="490" y="30" width="300" height="92" rx="14" style="stroke:#94a3b8"/>
    <circle cx="526" cy="64" r="20" fill="#334155"/><text x="526" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5f9">你</text>
    <text x="558" y="71" class="name">你</text>
    <text x="510" y="104" class="desc">描述任务、确认预算、回答提问</text>

    <!-- 平台工程师 -->
    <rect class="card" x="930" y="22" width="300" height="122" rx="14"/>
    <circle cx="966" cy="56" r="20" fill="#5a3a12"/><text x="966" y="62" text-anchor="middle" font-size="17" font-weight="700" fill="#fbbf24">工</text>
    <text x="998" y="63" class="name">平台工程师</text>
    <text x="950" y="96" class="desc">修改 Super Partner 本身：修缺陷、</text>
    <text x="950" y="118" class="desc">加组件，在隔离副本里改，测过才生效</text>

    <!-- 负责人 -->
    <rect x="436" y="200" width="408" height="118" rx="16" fill="#10261f" stroke="#3ddc97" stroke-width="2.5"/>
    <circle cx="476" cy="236" r="22" fill="#14532d"/><text x="476" y="243" text-anchor="middle" font-size="19" font-weight="700" fill="#3ddc97">负</text>
    <text x="510" y="244" class="name" style="font-size:22px">负责人</text>
    <text x="456" y="278" class="desc">规划任务，每次失败后决定怎么办，最后检查整体结果。</text>
    <text x="456" y="302" class="desc">同一个对话从规划一直保留到任务结束。</text>

    <!-- 员工 -->
    <rect class="card" x="50" y="384" width="280" height="122" rx="14"/>
    <circle cx="86" cy="418" r="20" fill="#1e3a5f"/><text x="86" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">员</text>
    <text x="118" y="425" class="name">员工</text>
    <text x="70" y="458" class="desc">在沙箱里用工具完成自己的步骤，</text>
    <text x="70" y="480" class="desc">发现新的子任务可以委派给同事</text>

    <!-- 验收者 -->
    <rect class="card" x="350" y="384" width="280" height="122" rx="14"/>
    <circle cx="386" cy="418" r="20" fill="#1e3a5f"/><text x="386" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">验</text>
    <text x="418" y="425" class="name">验收者</text>
    <text x="370" y="458" class="desc">由另一个模型担任，按验收标准</text>
    <text x="370" y="480" class="desc">检查每次结果，给出意见和证据</text>

    <!-- 进度检查员 -->
    <rect class="card" x="650" y="384" width="280" height="122" rx="14"/>
    <circle cx="686" cy="418" r="20" fill="#1e3a5f"/><text x="686" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">查</text>
    <text x="718" y="425" class="name">进度检查员</text>
    <text x="670" y="458" class="desc">每 10 分钟看一眼长时间运行的</text>
    <text x="670" y="480" class="desc">步骤，只叫停真正卡住的</text>

    <!-- 诊断员 -->
    <rect class="card" x="950" y="384" width="280" height="122" rx="14"/>
    <circle cx="986" cy="418" r="20" fill="#1e3a5f"/><text x="986" y="424" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">诊</text>
    <text x="1018" y="425" class="name">诊断员</text>
    <text x="970" y="458" class="desc">查任务之外的障碍：缺软件、</text>
    <text x="970" y="480" class="desc">权限、许可证、网络，并修好环境</text>
  </g>
</svg>
